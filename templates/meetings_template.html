<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Meeting Reports - {{BLOG_TITLE}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 学术论文风格配色 - 经典学术感 */
            --bg-primary: #fdfbf7;
            --bg-secondary: #f5f2eb;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #6b6b6b;
            --accent: #8b0000;          /* 深红色 - 学术感 */
            --accent-light: #a52a2a;
            --border: #d4d0c8;
            --border-light: #e8e4dc;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', 'Noto Serif SC', 'Times New Roman', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 17px;
        }

        /* 顶部导航 - 简洁学术风 */
        .nav-header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--accent);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* 页面标题区 */
        .page-header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            padding: 4rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .page-header .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .page-header .description {
            max-width: 700px;
            margin: 1.5rem auto 0;
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        /* 主内容区 */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* 报告卡片 - 学术论文列表风格 */
        .paper-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            padding: 1.5rem 2rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .paper-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .paper-card:hover {
            box-shadow: 0 4px 20px var(--shadow-hover);
            border-color: var(--accent);
        }

        .paper-card:hover::before {
            opacity: 1;
        }

        .paper-image {
            display: none; /* 学术风格不显示封面图 */
        }

        .paper-content {
            width: 100%;
        }

        .paper-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .meta-item i {
            color: var(--accent);
            font-size: 0.85rem;
        }

        .paper-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .paper-title:hover {
            color: var(--accent);
        }

        .paper-description {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .paper-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            border: 1px solid var(--border-light);
            font-family: 'Source Code Pro', monospace;
        }

        .paper-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .read-more {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .read-more:hover {
            gap: 0.6rem;
        }

        .pdf-download {
            background: var(--accent);
            color: white;
            padding: 0.4rem 1rem;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .pdf-download:hover {
            background: var(--accent-light);
        }

        /* 空状态 */
        .no-papers {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .no-papers i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--border);
        }

        .no-papers h3 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        /* 页脚 */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        .footer-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .paper-card {
                padding: 1.25rem;
            }

            .paper-title {
                font-size: 1.15rem;
            }

            .paper-actions {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <nav class="nav-header">
        <div class="nav-content">
            <a href="index.html" class="nav-brand">{{BLOG_TITLE}}</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="papers.html">Papers</a>
                <a href="meetings.html" style="color: var(--accent);">Meetings</a>
                <a href="{{GITHUB_URL}}" target="_blank">GitHub</a>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <header class="page-header">
        <h1>Group Meeting Reports</h1>
        <p class="subtitle">组会汇报记录</p>
        <p class="description">
            本页面收录了实验室组会汇报的 LaTeX 文档。所有文档均采用学术论文格式排版，
            包含研究进展汇报、论文分享与讨论等内容。
        </p>
    </header>

    <!-- 主内容 -->
    <main class="main-content">
        {{PAPERS_HTML}}
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="{{GITHUB_URL}}" target="_blank"><i class="fab fa-github"></i></a>
                <a href="mailto:{{EMAIL}}"><i class="fas fa-envelope"></i></a>
            </div>
            <p>© 2025 {{AUTHOR}} · Powered by LaTeX & Python</p>
        </div>
    </footer>
</body>
</html>
